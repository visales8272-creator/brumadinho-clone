<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Admin - exubigode | PTR Brumadinho</title>
    <link rel="stylesheet" media="all" href="/sites/default/files/css/css_IAt7QsBkcSoLSVa0_W0ywOs6ZhhS4lUqW-2FUg_iSj8.css?delta=0&amp;language=pt-br&amp;theme=fgv&amp;include=eJyNkdFyxCAIRX8ojZ-UQWWNuyiO6Kbp15ek2Wkf0tm8OHDvGRAAEWxTzHd0jatxIiPcuzScqBeYWkxIMeMA_3FyZrkZmuV2ZhEHnhzmVvnM1oLa-xZp8x0psRoLgq84oQgE7Xrkmb16XFGjmoDiFw742fTPD-OrjkDjkQ638DSB2AJ9SFtVCps0gdOS0UaKHjya3iLtOoXij4xzgwWFE5o_8big3VIZbYXs5T3ndGGc3nMyQy0Uw9wushVDJ6gXaWGd9QK7YwUqhAplltc-f5Wx59ItRZnRD7Lq5dLPsZ4RFzH7Oyb2nfAbm23z7Q" />
    <link rel="icon" href="/sites/default/themes/custom/fgv/favicon.ico" type="image/vnd.microsoft.icon" />
    <style>
      body { background:#f0f2f5; font-family: sans-serif; }
      .panel { max-width:900px; margin:40px auto; background:#fff; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.1); padding:32px; }
      .panel h1 { color:#0a3d62; }
      .section { border:1px solid #e0e0e0; border-radius:6px; padding:20px; margin-bottom:20px; }
      .section h2 { font-size:1.2rem; color:#0a3d62; margin-bottom:12px; }
      label { font-weight:600; display:block; margin-top:10px; }
      input, textarea, select { width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px; }
      button { margin-top:12px; padding:10px 20px; background:#0a3d62; color:#fff; border:none; border-radius:4px; cursor:pointer; }
      button:hover { background:#072a45; }
      .saved { color:green; margin-top:8px; display:none; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Painel Admin - exubigode</h1>
      <p class="text-muted">Configurações do site PTR Brumadinho (armazenadas localmente).</p>

      <div class="section">
        <h2>WhatsApp</h2>
        <label for="wa_number">Número (com DDD, sem espaços)</label>
        <input type="text" id="wa_number" value="74981059818" placeholder="5511999999999">
        <label for="wa_message">Mensagem padrão</label>
        <textarea id="wa_message" rows="2" placeholder="Olá, gostaria de mais informações."></textarea>
      </div>

      <div class="section">
        <h2>Chave PIX</h2>
        <label for="pix_key">Chave PIX</label>
        <input type="text" id="pix_key" placeholder="CPF, e-mail, telefone ou chave aleatória">
        <label for="pix_name">Nome do beneficiário</label>
        <input type="text" id="pix_name" placeholder="Nome completo">
        <label for="pix_city">Cidade</label>
        <input type="text" id="pix_city" placeholder="Brumadinho">
      </div>

      <div class="section">
        <h2>Gateways de Pagamento (em desenvolvimento)</h2>
        <label for="gw_mercadopago">Mercado Pago - Access Token</label>
        <input type="text" id="gw_mercadopago" placeholder="APP_USR-...">
        <label for="gw_pagseguro">PagSeguro - Token</label>
        <input type="text" id="gw_pagseguro" placeholder="Token PagSeguro">
        <label for="gw_stripe">Stripe - Secret Key</label>
        <input type="text" id="gw_stripe" placeholder="sk_live_...">
        <label for="gw_mode">Modo</label>
        <select id="gw_mode">
          <option value="sandbox">Sandbox (teste)</option>
          <option value="production">Produção</option>
        </select>
      </div>

      <button onclick="saveAll()">Salvar configurações</button>
      <div class="saved" id="saved">Salvo com sucesso!</div>
    </div>

    <script>
      const fields = ['wa_number','wa_message','pix_key','pix_name','pix_city','gw_mercadopago','gw_pagseguro','gw_stripe','gw_mode'];
      function loadAll(){
        fields.forEach(id=>{
          const el = document.getElementById(id);
          const v = localStorage.getItem('exubigode_'+id);
          if(v !== null) el.value = v;
          else localStorage.setItem('exubigode_'+id, el.value);
        });
      }
      function saveAll(){
        fields.forEach(id=>{
          localStorage.setItem('exubigode_'+id, document.getElementById(id).value);
        });
        const s = document.getElementById('saved');
        s.style.display='block';
        setTimeout(()=>s.style.display='none',2000);
      }
      loadAll();
    </script>
  </body>
</html>
